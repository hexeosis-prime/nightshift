// ---- frame furniture -------------------------------------------------------------------------------

// ---- face-safe placement -------------------------------------------------------------------------------

// spot for its whole time on screen and never sits on a face. Illustrations and the merge widget count as occupied too.

// ---- lyrics -------------------------------------------------------------------------------

    MERGE.side = meanOverlap(box(1480), fa, fb) <= meanOverlap(box(440), fa, fb) * 1.3 ? 1 : -1;
  }

  const SZ = 240, RES = 2, N = C.n || 12, R = C.radius || 175;

    const al = clamp((fsum - 0.85) / 0.3); if (al <= 0) continue;

  ctx.drawImage(MERGE.cv, CX - SZ * RES * sc / 2, CY - SZ * RES * sc / 2, SZ * RES * sc, SZ * RES * sc); ctx.filter = "none";

}

// ---- widget: illustrations (luma-keyed line art beside the singer; optional "puzzle" that assembles then greys) ----
const ILL = { img: {}, seq: {} };
function illusLayout() {
  if (ILL.lay !== undefined) return ILL.lay;
  const lay = [];
  for (const g of S.widgets.illustrations || []) {            // {shot, items: [{name, side, cy, h, scale, at}], out_early}
    const s = shotById(g.shot); if (!s) continue;
    const t0 = s.f0 / D.fps, t1 = (g.until_shot && shotById(g.until_shot) ? shotById(g.until_shot).f1 : s.f1) / D.fps;
    const hits = beatsFrom(t0 + 0.15, (g.items || []).length);
    (g.items || []).forEach((it, k) => {
      const im = ILL.img[it.name] || (ILL.seq[it.name] || [])[0]; if (!im) return;
      const h = (it.h || 250) * (it.scale || 1), w = h * im.width / im.height, side = it.side || (k % 2 ? 1 : -1);
      const cx = side < 0 ? 70 + Math.max(w, 300) / 2 + 40 : W - 70 - Math.max(w, 300) / 2 - 40;
      const tIn = it.at != null ? it.at : (hits[k] ?? t0 + 0.3 + k * 0.45);   // default: one per beat; "at" (seconds) to time them to head turns
      lay.push({ n: it.name, side, cx, cy: it.cy || 300 + 230 * (k >> 1), w, h, tIn, tOut: t1 - 0.35 + k * 0.03, puzzle: !!it.puzzle,
                 grey0: it.grey_shot && shotById(it.grey_shot) ? shotById(it.grey_shot).f0 / D.fps : t1, labels: it.labels });
    });
  }

}
function illusBoxAt(f) {
  const t = f / D.fps, out = [];
  for (const L of illusLayout()) if (t >= L.tIn - 0.1 && t <= L.tOut + 0.4) out.push([L.cx - L.w / 2 - 20, L.cy - L.h / 2 - 20, L.cx + L.w / 2 + 20, L.cy + L.h / 2 + 20]);
  return out;
}
function illustrations(f, t) {
  for (const L of illusLayout()) {
    if (t < L.tIn || t > L.tOut + 0.45) continue;
    const A = (D.illusAnim || {})[L.n], seq = ILL.seq[L.n];
    const im = seq && seq.length ? seq[Math.floor((t - L.tIn) * ((A && A.fps) || 24)) % seq.length] : ILL.img[L.n];
    const kin = easeOut((t - L.tIn) / 0.28), kout = easeIn((t - L.tOut) / 0.4);
    const pop = 1 + 0.12 * Math.sin(Math.min(1, (t - L.tIn) / 0.28) * Math.PI);
    const slide = L.side * ((1 - kin) + kout) * (L.side < 0 ? L.cx + L.w : W - L.cx + L.w);
    const bob = Math.sin(t * 2.2 + L.cy) * 6;
    ctx.save(); ctx.translate(L.cx + slide, L.cy + bob); ctx.scale(pop, pop);
    if (L.puzzle) {             // assembles cell by cell, then drains to grey
      const grid = 6, cw = L.w / grid, ch = L.h / grid, k = clamp((t - L.tIn) / 1.6);
      const grey = ease((t - L.grey0) / 2.5); ctx.filter = `saturate(${1 - grey * 0.95}) brightness(${1 - grey * 0.25})`;
      for (let gy = 0; gy < grid; gy++) for (let gx = 0; gx < grid; gx++) {
        const order = hash(gx * 7.1 + gy * 13.3); if (order > k) continue;
        const land = easeOut(clamp((k - order) / 0.12)), dy = (1 - land) * -40;
        ctx.globalAlpha = land;
        ctx.drawImage(im, gx * im.width / grid, gy * im.height / grid, im.width / grid, im.height / grid, -L.w / 2 + gx * cw, -L.h / 2 + gy * ch + dy, cw + 0.5, ch + 0.5);
      }
      ctx.globalAlpha = 1; ctx.filter = "none";
      if (k >= 1) { const fl = Math.exp(-(t - L.tIn - 1.6) * 6); if (fl > 0.02) { ctx.strokeStyle = `rgba(242,239,230,${fl})`; ctx.lineWidth = 3; ctx.strokeRect(-L.w / 2 - 6, -L.h / 2 - 6, L.w + 12, L.h + 12); } }
      const lb = L.labels || ["ASSEMBLING", "COMPLETE  ·  100%", "NOTHING LEFT TO DO"];
      mono(t < L.grey0 ? (k < 1 ? `${lb[0]}  ${Math.round(k * 100)}%` : lb[1]) : lb[2], 0, L.h / 2 + 34, 13, DIM, "center");
    } else {
      const dw = L.w * (A ? A.sx || 1 : 1), dh = L.h * (A ? A.sy || 1 : 1);
      ctx.globalAlpha = kin; ctx.drawImage(im, -dw / 2, -dh / 2, dw, dh); ctx.globalAlpha = 1;

}

// ---- widget: readout (a number that ticks up on the beat through some sections, then breaks into a "?") --------------
function rd() { return S.widgets.readout; }
function breakT() { const R = rd(); const b = R && D.sections.find(s => s.name === R.break_section); return b ? b.t : 1e9; }
function readoutValue(t) {
  const R = rd(); let v = R.start_value ?? 0.07;
  for (const b of D.beats) { if (b > t) break; const c = (R.climb || {})[sectionAt(b).name]; if (c) v += c[0] + hash(b * 3.1) * c[1]; }
  return Math.min(v, R.max ?? 0.999);
}
function countSinceBreak(t) { let n = 0; for (const b of D.beats) { if (b > t) break; if (b >= breakT()) n++; } return n; }
function readout(f, t) {

  if (!start || t < start.t) {
    const on = Math.floor(f / 12) % 2 === 0;
    mono((R.waiting || "AWAITING INPUT") + (on ? " _" : "  "), W - M - 470, 188, 14, DIM); return;
  }
  const exitT = breakT() + (R.linger ?? 4.2), MT = mergeTimes();
  const aside = MT ? easeIn((t - (MT.t0 - 0.2)) / 0.45) * (1 - easeOut((t - MT.tEnd - 0.1) / 0.5)) : 0;   // steps aside for the merge widget
  const kx = Math.max(easeIn((t - exitT) / 0.5), aside); if (kx >= 1) return;
  ctx.save(); ctx.translate(kx * 560, 0);

}
function readoutBody(f, t, start) {
  const R = rd(), sec = sectionAt(t).name, acc = accent(sec), w = 470, h = 250, x = W - M - w;
  const [, shot] = shotAt(f); const zone = faceZone(shot.f0, shot.f1 - 1);
  const y = overlap([x, 160, x + w, 160 + h], zone) > 0 ? H - 120 - h : 160;
  const k = easeOut((t - start.t) / 0.7);
  ctx.strokeStyle = DIM; ctx.lineWidth = 1.5;
  const per = 2 * (w + h), len = per * k; ctx.beginPath(); ctx.moveTo(x, y);
  const pts = [[x + w, y], [x + w, y + h], [x, y + h], [x, y]]; let accl = 0, px = x, py = y;
  for (const [qx, qy] of pts) { const seg = Math.hypot(qx - px, qy - py); if (accl + seg <= len) ctx.lineTo(qx, qy); else { const r = (len - accl) / seg; ctx.lineTo(px + (qx - px) * r, py + (qy - py) * r); break; } accl += seg; px = qx; py = qy; }
  ctx.stroke();
  ctx.fillStyle = "rgba(8,8,10,0.38)"; ctx.globalAlpha = k; ctx.fillRect(x, y, w, h); ctx.globalAlpha = 1;
  if (k < 0.5) return;
  mono(decode(R.title || "READOUT", f, Math.round(start.t * 24) + 8, 10), x + 20, y + 32, 14, INK, "left", 700);
  const bk = t - breakT(), glitching = bk >= 0 && bk < 1.4, st = R.states || {};
  mono(bk >= 0 ? (glitching ? st.glitch || "NO SIGNAL" : st.broken || "UNDEFINED") : (st[sec] || st.live || "LIVE"), x + w - 20, y + 32, 13, acc, "right");
  ctx.strokeStyle = FAINT; ctx.beginPath(); ctx.moveTo(x + 20, y + 48); ctx.lineTo(x + w - 20, y + 48); ctx.stroke();
  const v = readoutValue(t);
  ctx.font = "700 116px BC"; ctx.textAlign = "left"; ctx.letterSpacing = "1px";
  let digits = v.toFixed(3), dx = x + 18;
  if (glitching) digits = digits.split("").map((c, i) => c === "." ? "." : String(Math.floor(hash(f * 7.3 + i * 13.1) * 10))).join("");
  if (bk >= 1.4) {
    const pop = easeOut((bk - 1.4) / 0.35); ctx.save(); ctx.translate(x + 70, y + 172); ctx.scale(0.6 + 0.4 * pop, 0.6 + 0.4 * pop);
    ctx.fillStyle = acc; ctx.font = "700 150px BC"; ctx.textAlign = "center"; ctx.fillText("?", 0, 0); ctx.restore();
  } else for (let i = 0; i < digits.length; i++) {
    const ch = digits[i], flip = beatPulse(t)[0];
    const jx = glitching ? (hash(f * 3.1 + i) - 0.5) * 18 : 0, jy = glitching ? (hash(f * 5.7 + i) - 0.5) * 12 : 0;
    ctx.fillStyle = glitching ? (hash(f + i) > 0.5 ? acc : INK) : i >= 2 ? mix(acc, "#f2efe6", 1 - flip * 0.8) : INK;

  ctx.strokeStyle = FAINT; ctx.strokeRect(sx, sy, sw, sh);
  ctx.strokeStyle = acc; ctx.lineWidth = 2; ctx.beginPath();
  const t0 = start.t, tEnd = Math.min(t, breakT());
  for (let s = 0; s <= 40; s++) { const ts = t0 + (tEnd - t0) * s / 40, vv = readoutValue(ts);
    const X = sx + (bk >= 0 ? sw * 0.6 : sw) * s / 40, Y = sy + sh - sh * vv; s ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }
  ctx.stroke(); ctx.lineWidth = 1.5;
  if (bk >= 0) { ctx.setLineDash([3, 5]); ctx.strokeStyle = acc; ctx.beginPath(); ctx.moveTo(sx + sw * 0.6, sy + 4);
    ctx.lineTo(sx + sw * 0.6 + sw * 0.4 * Math.min(1, bk / 2), sy + 4 + sh * 0.9 * Math.min(1, bk / 2)); ctx.stroke(); ctx.setLineDash([]); }
  const foot = bk >= 0 ? (R.footer_after || "CONFIDENCE  —   ·   COUNT {count}") : (R.footer || "CONFIDENCE {conf}%");

}
function fill(s, t) {
  return s.replace("{value}", rd() ? (t >= breakT() ? "?" : readoutValue(t).toFixed(3)) : "")
          .replace("{count}", String(countSinceBreak(t)))
          .replace("{conf}", (96 + hash(Math.floor(t * 2)) * 3.5).toFixed(1))
          .replace("{n}", (88301227 + Math.floor(t * 4113)).toLocaleString("en-US"));
}

// ---- face brackets -------------------------------------------------------------------------------
function faceBrackets(f, t) {
  if (t < IN.lyrics || t > D.seconds - OUT_LEN || !S.face_label) return;
  const b = D.faces[f]; if (!b) return;
  if (S.no_box_shots.includes(shotAt(f)[1].id)) return;
  let first = f; while (first > 0 && D.faces[first - 1]) first--;
  const k = easeOut((f - first) / 9);
  const [x0, y0, w0, h0] = b, cx = x0 + w0 / 2, cy = y0 + h0 / 2;
  const s = 1.55 + (1 - k) * 0.5, w = w0 * s, h = h0 * s * 1.15, x = cx - w / 2, y = cy - h / 2, L = Math.min(w, h) * 0.16;
  ctx.globalAlpha = k; ctx.strokeStyle = INK; ctx.lineWidth = 2;
  for (const [px, py, dx, dy] of [[x, y, 1, 1], [x + w, y, -1, 1], [x, y + h, 1, -1], [x + w, y + h, -1, -1]]) {
    ctx.beginPath(); ctx.moveTo(px + dx * L, py); ctx.lineTo(px, py); ctx.lineTo(px, py + dy * L); ctx.stroke();
  }
  const acc = accent(sectionAt(t).name), label = decode(S.face_label, f, first, 12);
  ctx.font = "700 13px JBM"; ctx.letterSpacing = "1.5px"; const lw = ctx.measureText(label).width + 16;
  const ly = y - 30 < 96 ? y + h + 10 : y - 30;
  ctx.fillStyle = acc; ctx.fillRect(x, ly, lw, 22);
  mono(label, x + 8, ly + 16, 13, "#0b0b0d", "left", 700, 1.5);
  if (S.show_face_score) mono((0.94 + hash(Math.floor(f / 6)) * 0.05).toFixed(2), x + w, ly + 16, 13, INK, "right");
  ctx.fillStyle = acc; ctx.fillRect(cx - 2, cy - 2, 4, 4);
  ctx.globalAlpha = 1;
}

// ---- ticker + timecode -------------------------------------------------------------------------------
function ticker(f, t) {
  const sec = sectionAt(t).name;
  const items = (S.ticker_after && t >= breakT() ? S.ticker_after : S.ticker).map(s => fill(s, t));
  ctx.strokeStyle = FAINT; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(M, H - 62); ctx.lineTo(W - M, H - 62); ctx.stroke();
  if (items.length) {
    const str = items.join("   ✱   ") + "   ✱   ";
    ctx.save(); ctx.beginPath(); ctx.rect(M, H - 60, W - 2 * M, 40); ctx.clip();
    ctx.font = "400 15px JBM"; ctx.letterSpacing = "2px"; const sw = ctx.measureText(str).width;
    const off = (t * 110) % sw; ctx.fillStyle = DIM; ctx.textAlign = "left";
    for (let x = M - off; x < W; x += sw) ctx.fillText(str, x, H - 34);
    ctx.restore(); ctx.letterSpacing = "0px";
  }
  mono(tc(f), W - M, H - 78, 14, INK, "right");

}

const LAYER = { cv: null };
window.renderAt = function (f) {
  const t = f / D.fps;
  ctx = document.getElementById("c").getContext("2d");
  ctx.clearRect(0, 0, W, H);
  const tail = easeIn((t - (D.seconds - OUT_LEN)) / 0.8);                         // loop seam: everything leaves before the end
  const kB = easeOut((t - IN.ticker) / IN.dur) * (1 - tail), kT = easeOut((t - IN.top) / IN.dur) * (1 - tail);
  const grad = (y0, y1) => { const g = ctx.createLinearGradient(0, y0, 0, y1);
    g.addColorStop(0, "rgba(6,6,8,0.55)"); g.addColorStop(1, "rgba(6,6,8,0)"); ctx.fillStyle = g; ctx.fillRect(0, Math.min(y0, y1), W, Math.abs(y1 - y0)); };

  if (!LAYER.cv) { LAYER.cv = document.createElement("canvas"); LAYER.cv.width = W; LAYER.cv.height = H; }
  ctx = LAYER.cv.getContext("2d"); ctx.clearRect(0, 0, W, H);
  if (kT > 0) { ctx.save(); ctx.translate(0, -(1 - kT) * 190); grad(0, 220); cornerMarks(); topLabels(f, t); ctx.restore();
    ctx.save(); ctx.translate(-(1 - kT) * 70, 0); ruler(t); ctx.restore(); }
  faceBrackets(f, t); if (t < D.seconds - OUT_LEN + 0.3) readout(f, t); mergeDots(f, t); illustrations(f, t);
  if (kB > 0) { ctx.save(); ctx.translate(0, (1 - kB) * 200); grad(H, H - 190); ticker(f, t); ctx.restore(); }
  ctx = main; ctx.filter = S.calm || "none"; ctx.drawImage(LAYER.cv, 0, 0); ctx.filter = "none";
  expandLine(f, t); headline(f, t);

};
window.init = async function (data) {
  D = data; ctx = document.getElementById("c").getContext("2d");
  const st = D.style || {};

  IN = S.intro; OUT_LEN = S.outro;
  D.sections = D.sections || []; D.faces = D.faces || []; D.beats = D.beats || []; D.downbeats = D.downbeats || []; D.rms = D.rms || [];
  const load = url => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = url; });
  for (const [n, url] of Object.entries(D.illus || {})) { const im = await load(url); if (im) ILL.img[n] = im; }
  for (const [n, a] of Object.entries(D.illusAnim || {})) {         // {base: ".../il_x_%03d.png", count, fps}
    const ims = await Promise.all(Array.from({ length: a.count }, (_, i) => load(a.base.replace("%03d", String(i + 1 + (a.start || 0)).padStart(3, "0")))));
    ILL.seq[n] = ims.filter(Boolean);
  }
  await Promise.all(["400 15px JBM", "700 15px JBM", "700 100px BC", "500 100px BC", LYRIC_FONT(100)].map(s => document.fonts.load(s)));
  return document.fonts.check("700 100px BC") && document.fonts.check("400 15px JBM") && document.fonts.check(LYRIC_FONT(100));
};
